# PRs land on develop so dependency bumps flow through the same branch as other work.
version: 2
updates:
  - package-ecosystem: npm
    directory: /
    schedule:
      interval: weekly
    target-branch: develop
    ignore:
      # @types/node must describe the oldest Node we ship on, not the newest
      # that exists, otherwise tsc accepts APIs the runtime does not have.
      # That floor is Node 22 (Node 24 dropped the 32-bit ARM builds we need
      # for the armv7 add-on), so major bumps here are always wrong until the
      # runtime itself moves. Patch and minor updates still come through.
      - dependency-name: "@types/node"
        update-types: ["version-update:semver-major"]

  # The Node image pins in both Dockerfiles. Majors are ignored for the same
  # reason as @types/node above. The add-on Dockerfile's `apk add` floor is not
  # tracked; raise it by hand together with its builder pin.
  - package-ecosystem: docker
    directories:
      - /
      - /hassio-addon
    schedule:
      interval: weekly
    target-branch: develop
    allow:
      - dependency-name: node
    ignore:
      - dependency-name: node
        update-types: ["version-update:semver-major"]
    groups:
      node:
        patterns: ["node"]

  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
    target-branch: develop
